name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install

      - name: Create Capacitor Config & Web Assets
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          else
            echo "<h1 dir='rtl'>تطبيق الإبلاغ</h1>" > www/index.html
          fi

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.whatsapp.reportapp",
            "appName": "WhatsApp Report",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
